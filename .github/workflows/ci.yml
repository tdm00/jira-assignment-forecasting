name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests (with coverage)
        run: npm run test:coverage

      - name: Build single-file app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: jira-gantt-forecaster
          path: dist/index.html
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  release:
    name: Publish next release
    needs: test-and-build
    # v* tags still start CI. Publish only after a successful push to main so
    # creating vN does not create another tag or release.
    if: needs.test-and-build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: jira-gantt-forecaster
          path: release-asset

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin --tags --force

          # Highest tag that is v plus digits only (v1, v2, not v1.2.3). None yet -> v1.
          highest=0
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^v([0-9]+)$ ]]; then
              value=$((10#${BASH_REMATCH[1]}))
              if (( value > highest )); then
                highest=${value}
              fi
            fi
          done < <(git tag --list 'v*')

          release_tag="v$((highest + 1))"
          git tag "${release_tag}" "${{ github.sha }}"
          git push origin "${release_tag}"

          if [[ -f release-asset/index.html ]]; then
            mv release-asset/index.html jira-gantt-forecaster.html
          elif [[ -f release-asset/dist/index.html ]]; then
            mv release-asset/dist/index.html jira-gantt-forecaster.html
          else
            echo "jira-gantt-forecaster artifact did not contain index.html" >&2
            find release-asset -type f -print >&2
            exit 1
          fi

          gh release create "${release_tag}" jira-gantt-forecaster.html \
            --repo "${{ github.repository }}" \
            --title "${release_tag}" \
            --generate-notes
