name: CI

# test     -> every pull request and every push to main.
# release  -> push to main only. release-please opens or updates the release PR, or, when that
#             PR has just merged, creates the vX.Y.Z tag and GitHub Release and attaches the
#             single-file app that the test job built from that same commit.
# deploy   -> only when a release was created (or a manual rollback). Publishes the HTML attached
#             to that release to GitHub Pages, never a fresh build, then smoke-tests the live site.
# Rollback -> Actions > CI > Run workflow with an existing tag, or:
#             gh workflow run ci.yml -f tag=vX.Y.Z

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy to GitHub Pages (rollback), for example v5.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs. Runs on main and manual rollbacks each get their own group so
  # none of them is ever dropped; the release and deploy jobs queue through their own groups.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests (with coverage)
        run: npm run test:coverage

      - name: Build single-file app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jira-gantt-forecaster
          path: dist/index.html
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  release:
    name: release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-jira-gantt-forecaster
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # A fine-grained PAT (not GITHUB_TOKEN), so CI runs on the release PR and it can auto-merge.
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Download tested app
        if: steps.release-please.outputs.release_created == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jira-gantt-forecaster
          path: release-asset

      - name: Attach app to the release
        if: steps.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          asset="jira-gantt-forecaster-${TAG}.html"
          mv release-asset/index.html "${asset}"
          gh release upload "${TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"

      - name: Auto-merge the release PR
        if: steps.release-please.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Raw JSON, parsed in the shell: step env is evaluated even when `if` skips the step,
          # so fromJSON() on an empty output (no release PR) would fail the job.
          PR_JSON: ${{ steps.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number=$(jq -r '.number // empty' <<< "${PR_JSON}")
          if [[ -z "${pr_number}" ]]; then
            echo "No release PR to auto-merge."
            exit 0
          fi
          gh pr merge "${pr_number}" --auto --squash --repo "${GITHUB_REPOSITORY}"

  deploy:
    name: deploy
    needs: release
    # Runs after a new release, or on a manual rollback (when test and release are skipped).
    if: >-
      !cancelled() &&
      (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-jira-gantt-forecaster
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag_name }}
    steps:
      - name: Download the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+\.[0-9]+)?$ ]]; then
            echo "Not a release tag: ${TAG}" >&2
            exit 1
          fi
          # Releases from v5.0.1 on attach jira-gantt-forecaster-<tag>.html; v1-v5 attached
          # jira-gantt-forecaster.html.
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'jira-gantt-forecaster*.html' --dir release-asset
          shopt -s nullglob
          files=(release-asset/*.html)
          if (( ${#files[@]} != 1 )); then
            echo "Expected one app file on release ${TAG}, found ${#files[@]}" >&2
            exit 1
          fi
          mkdir site
          mv "${files[0]}" site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke test the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/?smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o page.html -w '%{http_code}' "${url}" || echo 000)
            if [[ "${status}" == 200 ]] \
              && grep -qF '<title>Jira Gantt Forecaster</title>' page.html \
              && grep -qF 'id="root"' page.html; then
              # Releases from v5.0.1 on bake their version into the app; older ones show a commit.
              if [[ ! "${TAG}" =~ \. ]] || grep -qF "${TAG} (" page.html; then
                echo "Smoke test passed: ${url} serves ${TAG}"
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: HTTP ${status}, ${TAG} not live yet. Retrying in 15s."
            sleep 15
          done
          echo "Smoke test failed: ${url} did not serve ${TAG}" >&2
          exit 1
