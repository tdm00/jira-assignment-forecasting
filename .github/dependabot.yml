version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Conventional PR titles, so squash merges feed release-please.
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
